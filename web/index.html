<!DOCTYPE html>
<html lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="مطعم شاميات - الذوق الشامي الأصيل">
  <meta name="viewport" id="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="apple-touch-icon" href="bg.webp">
  <link rel="icon" type="image/webp" href="bg.webp"/>

  <title>Shamiat - شاميات</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body { background-color: #1B4332; margin: 0; overflow: hidden; }
    #loading-screen {
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      height: 100vh; width: 100vw; position: fixed; z-index: 99999;
      background-color: #1B4332; transition: opacity 0.4s;
    }
    .logo {
      width: 150px; height: 150px; border-radius: 50%;
      border: 3px solid #BC8A5F; box-shadow: 0 0 25px rgba(0,0,0,0.4);
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .loader {
      margin-top: 30px; width: 40px; height: 40px;
      border: 3px solid rgba(188, 138, 95, 0.2); border-radius: 50%;
      border-top-color: #BC8A5F; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-screen">
    <img
      src="bg.webp"
      class="logo"
      alt="Logo"
      fetchpriority="high"
      loading="eager"
    >
    <div class="loader"></div>
  </div>

  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      var loadingScreen = document.getElementById('loading-screen');

      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: {{flutter_service_worker_version}},
        },
        onEntrypointLoaded: function(engineInitializer) {
          // تعديل: نحدد الخيار التلقائي الأسرع للمتصفح
          engineInitializer.initializeEngine({
            useColorEmoji: true
          }).then(function(appRunner) {
            appRunner.runApp().then(function() {
              if (loadingScreen) {
                loadingScreen.style.opacity = '0';
                setTimeout(function() { loadingScreen.remove(); }, 400);
              }
            });
          });
        }
      });
    });

    // تحسين: تقليل تكرار السكربت من 1 ثانية إلى 3 ثوانٍ لتخفيف الضغط على المعالج
    setInterval(function() {
      var meta = document.querySelector('meta[name="viewport"]');
      if (meta && (meta.content.includes('user-scalable=no') || meta.content.includes('maximum-scale=1.0'))) {
        meta.content = "width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes";
      }
    }, 3000);
  </script>
</body>
</html>
