  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      var loadingScreen = document.getElementById('loading-screen');

      function hideLoader() {
        if (loadingScreen && loadingScreen.parentNode) {
          loadingScreen.style.opacity = '0';
          setTimeout(function() {
            if (loadingScreen && loadingScreen.parentNode) {
              loadingScreen.remove();
            }
          }, 400);
        }
      }

      // Safe fallback timer: Ensure loading screen NEVER stays stuck
      setTimeout(hideLoader, 3500);

      // Safe Cache & Service Worker Cleanup
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var r of registrations) {
              r.unregister();
            }
          });
        }
      } catch(e) {}

      var loadConfig = {
        serviceWorker: {
          serviceWorkerVersion: {{flutter_service_worker_version}},
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            useColorEmoji: true
          }).then(function(appRunner) {
            appRunner.runApp().then(function() {
              hideLoader();
            });
          }).catch(function() {
            hideLoader();
          });
        }
      };

      if (window._flutter && window._flutter.loader) {
        if (typeof window._flutter.loader.loadEntrypoint === 'function') {
          window._flutter.loader.loadEntrypoint(loadConfig);
        } else if (typeof window._flutter.loader.load === 'function') {
          window._flutter.loader.load(loadConfig);
        } else {
          hideLoader();
        }
      } else {
        hideLoader();
      }
    });

    setInterval(function() {
      var meta = document.querySelector('meta[name="viewport"]');
      if (meta && (meta.content.includes('user-scalable=no') || meta.content.includes('maximum-scale=1.0'))) {
        meta.content = "width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes";
      }
    }, 3000);
  </script>
